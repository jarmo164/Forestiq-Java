[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "forestiq-ingest"
version = "0.1.0"
description = "Python ingestion runtime for ForestIQ external data sources"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.0,<2",
  "pyogrio>=0.9,<1",
  "shapely>=2.0,<3",
]
test = [
  "pytest>=8.3,<10",
]

[project.scripts]
forestiq-ingest-healthcheck = "forestiq_ingest.healthcheck:main"
forestiq-ingest-scheduler = "forestiq_ingest.scheduler:main"
forestiq-ingest-worker = "forestiq_ingest.worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forestiq_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires a real PostgreSQL/PostGIS service",
]
