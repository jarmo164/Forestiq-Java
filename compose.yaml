name: forestiq

# LOCAL DEVELOPMENT ONLY. This stack intentionally uses Keycloak start-dev and
# the non-production Spring profile. Deployable environments must add
# compose.prod.yaml (or an equivalent platform deployment) so production guards
# and production Keycloak mode are active.
services:
  postgres:
    image: postgis/postgis:17-3.5
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-8GB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT_MS:-500}
    # postgis/postgis may not publish a native image for every developer CPU.
    # Make emulation explicit instead of accepting Docker's implicit mismatch.
    # Override POSTGRES_PLATFORM only after verifying the selected tag supports it.
    platform: ${POSTGRES_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_DATABASE_USER: ${API_DATABASE_USER:?Set API_DATABASE_USER in .env}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD in .env}
      INGEST_DATABASE_USER: ${INGEST_DATABASE_USER:?Set INGEST_DATABASE_USER in .env}
      INGEST_DATABASE_PASSWORD: ${INGEST_DATABASE_PASSWORD:?Set INGEST_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${LOCAL_PORT_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    command: start-dev --health-enabled=true --metrics-enabled=true --http-port=8080
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KEYCLOAK_ADMIN_API_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_API_CLIENT_SECRET in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${NEXT_PUBLIC_KEYCLOAK_URL:?Set NEXT_PUBLIC_KEYCLOAK_URL in .env}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${LOCAL_PORT_HOST:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8080"

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.1.3
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./infra/keycloak/forestiq-realm.json:/import/forestiq-realm.json:ro
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user "$$KEYCLOAK_ADMIN" --password "$$KEYCLOAK_ADMIN_PASSWORD"
        if /opt/keycloak/bin/kcadm.sh get realms/forestiq-dev >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh update realms/forestiq-dev -f /import/forestiq-realm.json
        else
          /opt/keycloak/bin/kcadm.sh create realms -f /import/forestiq-realm.json
        fi
        /opt/keycloak/bin/kcadm.sh add-roles -r forestiq-dev --uusername service-account-forestiq-admin-api --cclientid realm-management --rolename manage-users --rolename query-users --rolename view-realm --rolename view-users || true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data
    ports:
      - "${LOCAL_PORT_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${LOCAL_PORT_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: core
      FORESTIQ_RUNTIME_ROLE: api
      FORESTIQ_RUNTIME_PYTHON_JOB_KEYS: ${INGEST_PYTHON_JOB_KEYS:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DATABASE_USERNAME: ${API_DATABASE_USER:?Set API_DATABASE_USER in .env}
      DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD in .env}
      FLYWAY_DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      FLYWAY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      KEYCLOAK_ISSUER_URI: ${NEXT_PUBLIC_KEYCLOAK_URL:?Set NEXT_PUBLIC_KEYCLOAK_URL in .env}/realms/${KEYCLOAK_REALM:?Set KEYCLOAK_REALM in .env}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?Set KEYCLOAK_REALM in .env}/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:?Set KEYCLOAK_REALM in .env}
      KEYCLOAK_ADMIN_CLIENT_ID: forestiq-admin-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_API_CLIENT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_PATH_STYLE_ACCESS: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      FORESTIQ_BUSINESS_CALENDAR_ADDITIONAL_HOLIDAYS: ${FORESTIQ_BUSINESS_CALENDAR_ADDITIONAL_HOLIDAYS:-}
      FORESTIQ_BUSINESS_CALENDAR_WORKING_DAY_OVERRIDES: ${FORESTIQ_BUSINESS_CALENDAR_WORKING_DAY_OVERRIDES:-}

      # External-source provider configuration is intentionally absent here.
      # Manual actions enqueue durable commands; only ingest-worker calls providers.
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${LOCAL_PORT_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"


  ingest-scheduler:
    build:
      context: ./ingest
    command: ["python", "-m", "forestiq_ingest.scheduler"]
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      DATABASE_URL: postgresql://${INGEST_DATABASE_USER:?Set INGEST_DATABASE_USER in .env}:${INGEST_DATABASE_PASSWORD:?Set INGEST_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FORESTIQ_INGEST_COMPONENT: scheduler
      FORESTIQ_INGEST_ENABLED_JOB_KEYS: ${INGEST_ENABLED_JOB_KEYS:-OWNER_CADASTRE_RELATIONS,WEASEL_OWNERSHIP_TRANSITIONS,INHERITANCE_NOTICES}
      FORESTIQ_INGEST_SCHEDULER_POLL_SECONDS: ${INGEST_SCHEDULER_POLL_SECONDS:-30}
      FORESTIQ_INGEST_SCHEDULER_LEASE_SECONDS: ${INGEST_SCHEDULER_LEASE_SECONDS:-90}
      FORESTIQ_INGEST_MAX_CATCHUP_WINDOWS: ${INGEST_MAX_CATCHUP_WINDOWS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "forestiq_ingest.healthcheck", "--component", "scheduler", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s

  ingest-worker:
    build:
      context: ./ingest
    command: ["python", "-m", "forestiq_ingest.worker"]
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      DATABASE_URL: postgresql://${INGEST_DATABASE_USER:?Set INGEST_DATABASE_USER in .env}:${INGEST_DATABASE_PASSWORD:?Set INGEST_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FORESTIQ_INGEST_COMPONENT: worker
      FORESTIQ_INGEST_ENABLED_JOB_KEYS: ${INGEST_ENABLED_JOB_KEYS:-OWNER_CADASTRE_RELATIONS,WEASEL_OWNERSHIP_TRANSITIONS,INHERITANCE_NOTICES}
      FORESTIQ_INGEST_WORKER_ID: ${INGEST_WORKER_ID:-local-worker-1}
      FORESTIQ_INGEST_WORKER_POLL_SECONDS: ${INGEST_WORKER_POLL_SECONDS:-2}
      FORESTIQ_INGEST_HEARTBEAT_SECONDS: ${INGEST_HEARTBEAT_SECONDS:-15}
      FORESTIQ_INGEST_LEASE_SECONDS: ${INGEST_LEASE_SECONDS:-90}
      FORESTIQ_INGEST_TEMP_DIR: /var/tmp/forestiq-ingest
      METSIS_PORTFOLIO_URI: ${METSIS_PORTFOLIO_URI:-}
      METSIS_PORTFOLIO_AUTHORIZATION: ${METSIS_PORTFOLIO_AUTHORIZATION:-}
      METSIS_PORTFOLIO_ORGANIZATION_ID: ${METSIS_PORTFOLIO_ORGANIZATION_ID:-}
      WEASEL_API_BASE_URL: ${WEASEL_API_BASE_URL:-}
      WEASEL_API_ACCESS_TOKEN: ${WEASEL_API_ACCESS_TOKEN:-}
      WEASEL_ORGANIZATION_ID: ${WEASEL_ORGANIZATION_ID:-}
      METSAREGISTER_WFS_URL: ${METSAREGISTER_WFS_URL:-https://gsavalik.envir.ee/geoserver/metsaregister/ows}
      MARU_CADASTRE_SNAPSHOT_URL: ${MARU_CADASTRE_SNAPSHOT_URL:-https://s3.pilw.io/rp-kemit-kataster/ANDMED/Eesti_KATASTER_GPKG.zip}
      GEOSPATIAL_DOWNLOAD_DIR: ${GEOSPATIAL_DOWNLOAD_DIR:-/var/tmp/forestiq-ingest/cadastre}
      INHERITANCE_SOURCE_BASE_URL: ${INHERITANCE_SOURCE_BASE_URL:-}
      INHERITANCE_SOURCE_API_TOKEN: ${INHERITANCE_SOURCE_API_TOKEN:-}
      INHERITANCE_SOURCE_URI_TEMPLATE: ${INHERITANCE_SOURCE_URI_TEMPLATE:-https://www.ametlikudteadaanded.ee/ee/-/parimisteated/parimismenetluse-algatamine/%04d/%02d/%02d/xml}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /var/tmp/forestiq-ingest:size=1073741824,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "forestiq_ingest.healthcheck", "--component", "worker", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:?Set NEXT_PUBLIC_KEYCLOAK_URL in .env}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:?Set NEXT_PUBLIC_KEYCLOAK_REALM in .env}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:?Set NEXT_PUBLIC_KEYCLOAK_CLIENT_ID in .env}
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-replace-with-maptiler-key}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8080}
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:?Set NEXT_PUBLIC_KEYCLOAK_URL in .env}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:?Set NEXT_PUBLIC_KEYCLOAK_REALM in .env}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:?Set NEXT_PUBLIC_KEYCLOAK_CLIENT_ID in .env}
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-replace-with-maptiler-key}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LOCAL_PORT_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
  minio-data:
