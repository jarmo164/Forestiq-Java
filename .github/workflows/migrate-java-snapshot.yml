name: Migrate ForestIQ Java snapshot
# one-time migration trigger

on:
  push:
    paths:
      - ".github/workflows/migrate-java-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Java snapshot from ForestIQ_Legacy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/forestiq-java-source
          mkdir -p /tmp/forestiq-java-source
          git -C /tmp/forestiq-java-source init
          git -C /tmp/forestiq-java-source remote add origin https://github.com/jarmo164/ForestIQ_Legacy.git
          git -C /tmp/forestiq-java-source fetch --depth 1 origin 230ca9bd302924da33e6c7b8402c8a09f2881e88
          git -C /tmp/forestiq-java-source checkout --detach FETCH_HEAD

      - name: Replace target contents with Java snapshot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git /tmp/forestiq-java-source/ ./
          git status --short

      - name: Commit and push snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Import ForestIQ Java snapshot from 230ca9bd"
          git push origin HEAD:main
