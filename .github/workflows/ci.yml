name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change classification
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      ingest: ${{ steps.paths.outputs.ingest }}
      contract: ${{ steps.paths.outputs.contract }}
      observability: ${{ steps.paths.outputs.observability }}
      ci_config: ${{ steps.paths.outputs.ci_config }}
      render_contract: ${{ steps.paths.outputs.contract }}
      heavy: ${{ steps.paths.outputs.heavy }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      changed_files: ${{ steps.paths.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify CI runner trust boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            [[ "${RUNNER_OS}" == "Linux" ]] || { echo "::error::Fork PR must remain on GitHub-hosted Linux infrastructure."; exit 1; }
            echo "::notice::Untrusted fork PR is isolated from the persistent ForestIQ runner."
          else
            [[ "${RUNNER_OS}" == "macOS" && "${RUNNER_ARCH}" == "ARM64" ]] || {
              echo "::error::Trusted canonical CI requires the repository-scoped macOS ARM64 runner.";
              exit 1;
            }
            echo "::notice::Trusted canonical CI is running on ${RUNNER_NAME:-unknown} (${RUNNER_OS}/${RUNNER_ARCH})."
          fi
      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          bash scripts/ci/classify-changes.sh \
            "${{ github.event_name }}" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}"

  backend:
    name: Backend unit / Java 21
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Run backend unit checks
        run: ./gradlew --no-daemon test jacocoTestCoverageVerification
      - name: Upload backend unit diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-unit-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend unit / Node 22
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
          run_install: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm lint
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Run frontend unit tests with coverage gate
        run: pnpm test:unit:coverage
      - name: Upload frontend diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  ingest-unit:
    name: Ingestion unit / Python 3.13
    needs: changes
    if: ${{ needs.changes.outputs.ingest == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.13 on hosted runner
        if: ${{ runner.os != 'macOS' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ingest/pyproject.toml
      - name: Prepare Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            python3 - <<'PY'
          import sys
          print(sys.version)
          if sys.version_info < (3, 13):
              raise SystemExit("ForestIQ trusted CI requires Python >= 3.13")
          PY
            venv="${RUNNER_TEMP}/forestiq-ingest-unit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "${venv}"
            python3 -m venv "${venv}"
            echo "PYTHON_BIN=${venv}/bin/python" >> "${GITHUB_ENV}"
          else
            echo "PYTHON_BIN=python" >> "${GITHUB_ENV}"
          fi
      - name: Install ingestion test dependencies
        run: '"$PYTHON_BIN" -m pip install -e "./ingest[test]"'
      - name: Run pure Python ingestion tests
        working-directory: ingest
        run: |
          mkdir -p artifacts
          "$PYTHON_BIN" -m pytest -m "not integration" --junitxml=artifacts/unit.xml
      - name: Upload ingestion unit diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ingest-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ingest/artifacts/
          if-no-files-found: warn
          retention-days: 14

  ingestion-contract:
    name: Ingestion contract
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' || needs.changes.outputs.ingest == 'true' }}
    uses: ./.github/workflows/ingestion-contract.yml

  render-contract:
    name: Render Blueprint contract
    needs: changes
    if: ${{ needs.changes.outputs.render_contract == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Render Blueprint environment contract
        run: |
          python3 scripts/validate_render_blueprint_contract.py
          python3 -m unittest scripts/test_render_blueprint_contract.py

  ci-config:
    name: CI configuration sanity
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, forestiq, heavy-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate CI and runner changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              *.sh)
                bash -n "$path"
                ;;
            esac
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          python3 scripts/ci/validate-runner-boundaries.py
          python3 scripts/validate-security-workflow.py
          python3 scripts/ci/validate-fork-heavy-policy.py
          python3 scripts/validate-github-action-pins.py
          python3 -m unittest scripts/ci/test_validate_gate_results.py

  security-lite:
    name: Security lite
    needs: changes
    if: ${{ needs.changes.outputs.ci_config != 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  security-full:
    name: Full security gate
    needs: changes
    if: ${{ needs.changes.outputs.ci_config != 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  observability-config:
    name: Observability config
    needs: changes
    if: ${{ needs.changes.outputs.observability == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate observability files
        run: python3 scripts/validate-observability-config.py


  fast-quality-gate:
    name: fast-quality-gate
    if: ${{ always() }}
    needs:
      - changes
      - backend
      - frontend
      - ingest-unit
      - ingestion-contract
      - render-contract
      - security-lite
      - security-full
      - observability-config
      - ci-config
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require classifier-selected jobs to match expected results
        shell: bash
        run: |
          python3 scripts/ci/validate_gate_results.py \
            --changed-files "${{ needs.changes.outputs.changed_files }}" \
            --job "changes:true:${{ needs.changes.result }}" \
            --job "backend:${{ needs.changes.outputs.backend }}:${{ needs.backend.result }}" \
            --job "frontend:${{ needs.changes.outputs.frontend }}:${{ needs.frontend.result }}" \
            --job "ingest-unit:${{ needs.changes.outputs.ingest }}:${{ needs.ingest-unit.result }}" \
            --job "ingestion-contract:${{ (needs.changes.outputs.contract == 'true' || needs.changes.outputs.ingest == 'true') && 'true' || 'false' }}:${{ needs.ingestion-contract.result }}" \
            --job "render-contract:${{ needs.changes.outputs.render_contract }}:${{ needs.render-contract.result }}" \
            --job "security-lite:${{ needs.changes.outputs.ci_config != 'true' && 'true' || 'false' }}:${{ needs.security-lite.result }}" \
            --job "security-full:${{ needs.changes.outputs.ci_config != 'true' && 'true' || 'false' }}:${{ needs.security-full.result }}" \
            --job "observability-config:${{ needs.changes.outputs.observability }}:${{ needs.observability-config.result }}" \
            --job "ci-config:${{ needs.changes.outputs.ci_config }}:${{ needs.ci-config.result }}"
