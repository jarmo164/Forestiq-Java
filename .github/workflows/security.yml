name: Security

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  codeql:
    name: CodeQL
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Analyze and upload SARIF
        continue-on-error: true
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
      - name: Explain optional CodeQL upload
        if: ${{ always() }}
        run: |
          echo "CodeQL query execution is kept in CI, but SARIF upload is non-blocking until GitHub code scanning is enabled for this repository."

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","forestiq","heavy-ci"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
          run_install: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Set up Python 3.13 on hosted runner
        if: ${{ runner.os != 'macOS' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ingest/pyproject.toml
            ingest/security-constraints.txt
      - name: Prepare Python audit runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            python3 - <<'PY'
          import sys
          print(sys.version)
          if sys.version_info < (3, 13):
              raise SystemExit("ForestIQ trusted security CI requires Python >= 3.13")
          PY
            venv="${RUNNER_TEMP}/forestiq-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "${venv}"
            python3 -m venv "${venv}"
            echo "PYTHON_BIN=${venv}/bin/python" >> "${GITHUB_ENV}"
          else
            echo "PYTHON_BIN=python" >> "${GITHUB_ENV}"
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Audit backend dependencies
        working-directory: backend
        run: ./gradlew --no-daemon dependencyCheckAnalyze
      - name: Install deterministic Python runtime and audit tool
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install -c ingest/security-constraints.txt ./ingest pip-audit
      - name: Audit installed Python runtime
        run: '"$PYTHON_BIN" -m pip_audit --local'
      - name: Upload dependency audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/reports/dependency-check-report.html
            backend/build/reports/dependency-check-report.sarif
          if-no-files-found: warn
          retention-days: 14
