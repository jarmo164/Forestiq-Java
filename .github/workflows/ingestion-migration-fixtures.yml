name: Ingestion migration fixture validation

on:
  pull_request:
    paths:
      - "docs/ingestion-migration/**"
      - "scripts/validate_ingestion_migration_fixtures.py"
      - ".github/workflows/ingestion-migration-fixtures.yml"
  push:
    branches:
      - main
    paths:
      - "docs/ingestion-migration/**"
      - "scripts/validate_ingestion_migration_fixtures.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python scripts/validate_ingestion_migration_fixtures.py
